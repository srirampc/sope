[package]
name = "sope"
version = "0.4.1"
edition = "2024"
readme = "README.md"
repository = "https://github.com/srirampc/sope"
license = "Apache-2.0"
description = "Simplified, and type-safe interface to MPI with error handling"
# TODO:: Add documentation and create homepage
documentation = "https://github.com/srirampc/sope"
homepage = "https://github.com/srirampc/sope"

[workspace]
members = [".", "sope-derive"]

[dependencies]
sope_derive = { path = "./sope-derive", version = "0.4" }
anyhow = "1.0.100"
chrono = "0.4.43"
lazy_static = "1.5.0"
log = "0.4.29"
num = "0.4.3"
mpi = { version = "0.8.1", features = ["user-operations", "derive"] }
thiserror = "2.0.17"

[dev-dependencies]
clap = { version = "4.5.54", features = ["derive"] }
env_logger = "0.11.8"
rand = { version = "0.10", features = ["chacha"] }
serde = { version = "1.0.228", features = ["derive", "std"] }
serde_json = "1.0"
serde-saphyr = "0.0.23"
