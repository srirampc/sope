[package]
name = "sope_derive"
version = "0.4.2"
edition = "2024"
readme = "README.md"
repository = "https://github.com/srirampc/sope"
license = "Apache-2.0"
description = "Derive macros for sope library"
# TODO:: Add documentation and create homepage
documentation = "https://github.com/srirampc/sope"
homepage = "https://github.com/srirampc/sope"


[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
lazy_static = "1.5.0"
mpi = { version = "0.8.1", features = ["user-operations", "derive"] }
